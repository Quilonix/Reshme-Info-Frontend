name: reshmeinfo
description: Karnataka Silk Cocoon Market Prices & Sericulture Knowledge Hub
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Realtime
  supabase_flutter: ^2.8.0

  # Firebase Core, FCM & Google Analytics 4
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^17.2.3

  # UI, Charts & Media
  fl_chart: ^0.70.0
  youtube_player_iframe: ^5.2.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
